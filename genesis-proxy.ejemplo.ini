# Copiar como genesis-proxy.ini al lado de app.py (o del .exe). Todos los valores son opcionales.
# Mismo formato y claves que genesis-proxy.ini de genesis-fiscal: el mismo archivo sirve para los dos.
# Cada clave se puede pisar con una variable de entorno (ver genesis_service/config.py).

# Puerto serie del Genesis. "auto" busca el adaptador USB CH340 (COM4 en unas cajas, COM5 en otras;
# en Linux, /dev/ttyUSB0).
puerto_serie = auto
baudios = 115200

# Donde escucha. 127.0.0.1 = solo esta PC. Usar 0.0.0.0 si el POS corre en otra maquina.
escuchar = 127.0.0.1
puerto_http = 5005

# si = no abre el puerto serie y contesta un impresor simulado (para probar sin emitir nada).
simular = no

# Abre el cajon en cada venta (no en notas de credito).
abrir_cajon = si

# Guarda cada trama enviada y recibida en el log (incluye datos de ventas).
log_detallado = si

# Carpeta del log y del registro de pedidos emitidos. Por defecto %ProgramData%\GenesisProxy.
# carpeta_datos = C:\ProgramData\GenesisProxy

# no = numero de secuencia fijo A9, como ProtoEmul (lo probado en el impresor).
# si = secuencia incremental 81..FE y se descartan las respuestas que no son del comando enviado.
#      Evita tomar una respuesta atrasada como propia. SIN PROBAR en el impresor real.
secuencia_incremental = no

# Clave compartida con Odoo (campo "Clave de firma del proxy fiscal" del punto de venta). Si esta
# puesta, los pedidos que emiten algo tienen que venir firmados. Una clave distinta por caja.
# Para generar una:  python -c "import secrets; print(secrets.token_hex(32))"
# Vacia = no se exige firma.
clave_firma =

# Tolerancia, en segundos, entre la hora de quien firma y la de esta PC.
firma_ventana_seg = 120

# Paginas desde las que se aceptan pedidos (cabecera Origin), separadas por coma. Los pedidos sin
# Origin (curl, abrir la URL a mano) no se controlan aca. Vacio = cualquier origen.
origenes = https://www.casagoro.com.ar, https://test19.casagoro.com.ar
